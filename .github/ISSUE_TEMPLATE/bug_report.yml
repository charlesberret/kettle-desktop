name: Bug report
description: Report a reproducible Kettle Desktop problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Desktop 0.1.0, core commit, macOS version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include sanitized logs without private project paths or data.
